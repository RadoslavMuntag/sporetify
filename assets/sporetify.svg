      <stop offset="0" stop-color="#1f3a3a"/>
      <stop offset="1" stop-color="#12201f"/>
    </linearGradient>
    <radialGradient id="body" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#a6f0c6"/>
      <stop offset="1" stop-color="#3fb98a"/>
