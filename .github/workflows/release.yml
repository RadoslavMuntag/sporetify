name: Release

# Builds the daemon that scripts/setup.sh downloads.
#   - A tag "v<version>" publishes a GitHub release with the daemon attached.
#   - A manual run builds the same archive and keeps it as a workflow
#     artifact, to check the build without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daemon:
    name: Build daemon
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Arch, like the Omarchy machines the binary will run on, so it links
    # against the same libraries.
    container: archlinux:latest
    env:
      CARGO_HOME: /tmp/ci/cargo
      CARGO_TARGET_DIR: /tmp/ci/target
      CARGO_TERM_COLOR: always
    steps:
      - name: Install toolchain and libraries
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git jq rust openssl libpulse qt6-declarative github-cli

      - uses: actions/checkout@v4

      # The tag, the manifest and the daemon must all name the same version,
      # or setup.sh would look for a file that is not there.
      - name: Check versions agree
        run: |
          version=$(jq -r .version manifest.json)
          tests/lint.sh
          if [[ $GITHUB_REF == refs/tags/* && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
        shell: bash

      - name: Run all checks
        run: scripts/test.sh

      - name: Build and package
        run: |
          cargo build --release --locked --manifest-path daemon/Cargo.toml
          name="sporetifyd-$VERSION-x86_64-linux"
          mkdir dist
          tar -czf "dist/$name.tar.gz" -C "$CARGO_TARGET_DIR/release" sporetifyd
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: sporetifyd-${{ env.VERSION }}-x86_64-linux
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          notes=$(awk -v v="$VERSION" '$0 ~ "^## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Sporetify $VERSION" --notes "${notes:-See CHANGELOG.md}"
        shell: bash
