[package]
name = "sporetifyd"
version = "0.1.0"
edition = "2021"
description = "Sporetify daemon: playback, Spotify API, cache and the frontend socket"
publish = false

[dependencies]
futures-util = "0.3"
libc = "0.2"
librespot-connect = "0.8"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-oauth = "0.8"
librespot-playback = { version = "0.8", default-features = false, features = ["pulseaudio-backend", "native-tls"] }
librespot-protocol = "0.8"
mpris-server = { version = "0.10.0", features = ["tokio"] }
protobuf = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal", "process"] }

[profile.release]
lto = "thin"
strip = true
